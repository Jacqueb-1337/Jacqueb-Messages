name: Android build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Assemble preview APK
        run: bash ./gradlew :app:assembleFossDebug --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: Jacqueb-Messages-debug
          path: app/build/outputs/apk/foss/debug/*.apk
